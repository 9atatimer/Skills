name: Publish to GitHub Packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the version is a rev-list count over the payload
          # paths (see "Stamp version"), which a shallow clone collapses to 1.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@nine-at-a-time-media'

      - name: Test
        run: npm test

      # The payload auto-versions so a skill merge IS the rollout -- no manual
      # bump to forget.
      #
      # The 0.2.x SERIES IS DELIBERATE and must not be reverted to 0.1.x.
      # template-tools published this same package name up to 0.1.85 using
      # `0.1.<count>` over ITS history. This repo's count over the same paths
      # is far lower (2 at the time of writing), so 0.1.<count> here would
      # resolve to versions template-tools already published -- `publish_if_new`
      # would report "already published", CI would go green, and NOTHING would
      # ship. The fleet would keep receiving 0.1.85 forever with no failing
      # signal anywhere. 0.2.x clears the whole prior series in one step and
      # stays monotonic, because the count only ever grows.
      - name: Stamp version
        run: |
          set -euo pipefail
          count=$(git rev-list --count HEAD -- skills mcp/manifest.json)
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = '0.2.' + process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            console.log('skills version: ' + p.version);
          " "${count}"

      # Cross-org publish: this repo lives in 9atatimer, the package scope is
      # @nine-at-a-time-media. The built-in GITHUB_TOKEN cannot write across
      # orgs, so this needs a classic PAT with write:packages + repo.
      - name: Publish if new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PAT_NAATM_PACKAGES_RW }}
        run: |
          set -euo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::GH_PAT_NAATM_PACKAGES_RW is not set on this repository."
            echo "Mint a classic PAT with write:packages + repo and add it as a repo secret."
            exit 1
          fi

          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")

          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "skip: ${name}@${version} already published"
            exit 0
          fi

          echo "publish: ${name}@${version}"
          npm publish

      - name: Summarize
        if: always()
        run: |
          version=$(node -p "require('./package.json').version")
          echo "### skills payload" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "- version: \`${version}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- stamp: \`$(cat SOURCE_STAMP 2>/dev/null || echo 'not written')\`" >> "${GITHUB_STEP_SUMMARY}"
