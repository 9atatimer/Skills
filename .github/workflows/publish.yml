name: Publish to GitHub Packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the version is a rev-list count over the payload
          # paths (see "Stamp version"), which a shallow clone collapses to 1.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@nine-at-a-time-media'

      - name: Test
        run: npm test

      # The payload auto-versions so a merge IS the rollout -- no manual bump
      # to forget. The rule (which paths count, and why the series is 0.2)
      # lives in scripts/version.mjs so it can be tested; `npm test` above
      # guards it. It used to be inline here, where the path list could be
      # narrowed by anyone editing YAML with nothing to notice.
      - name: Stamp version
        run: |
          set -euo pipefail
          count=$(git rev-list --count HEAD -- \
            $(node --input-type=module -e "
              import { VERSION_PATHS } from './scripts/version.mjs';
              process.stdout.write(VERSION_PATHS.join(' '));
            "))
          version=$(node scripts/version.mjs "${count}")
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            console.log('skills version: ' + p.version);
          " "${version}"

      # Cross-org publish: this repo lives in 9atatimer, the package scope is
      # @nine-at-a-time-media. The built-in GITHUB_TOKEN cannot write across
      # orgs, so this needs a classic PAT with write:packages + repo.
      - name: Publish if new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PAT_NAATM_PACKAGES_RW }}
        run: |
          set -euo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::GH_PAT_NAATM_PACKAGES_RW is not set on this repository."
            echo "Mint a classic PAT with write:packages + repo and add it as a repo secret."
            exit 1
          fi

          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")

          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "skip: ${name}@${version} already published"
            exit 0
          fi

          echo "publish: ${name}@${version}"
          npm publish

      - name: Summarize
        if: always()
        run: |
          version=$(node -p "require('./package.json').version")
          echo "### skills payload" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "- version: \`${version}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- stamp: \`$(cat SOURCE_STAMP 2>/dev/null || echo 'not written')\`" >> "${GITHUB_STEP_SUMMARY}"
