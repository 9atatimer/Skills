# review-settled.yml -- post the `review-settled` commit status on every
# PR head: green iff Copilot's newest review is on the current head and
# every review thread is resolved. The main ruleset requires it; tedium
# checks it in `pr_status` (tedium.toml) before batching a PR.
#
# The checker is the reusable workflow in the public tds-utils repo
# (9atatimer/tds-utils .github/workflows/review-settled.yml). GitHub has
# no workflow trigger for a thread being resolved, so this fires on the
# review, on replies in threads, on PR comments (the epilogue posted
# after resolving), on pushes, and by hand.

name: review-settled

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to re-evaluate
        type: number
        required: true

concurrency:
  group: review-settled-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review-settled:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    uses: 9atatimer/tds-utils/.github/workflows/review-settled.yml@master
    permissions:
      statuses: write
      pull-requests: read
      contents: read
    with:
      reviewers: copilot-pull-request-reviewer
      pr: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
