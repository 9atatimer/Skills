# review-settled.yml -- post the `review-settled` commit status on every
# PR head: green iff the gate reviewer's newest review is on the current
# head and every review thread is resolved. The main ruleset requires it;
# tedium checks it in `pr_status` (tedium.toml) before batching a PR.
#
# The gate reviewer is Codex (`reviewers:` below; every login listed must
# have reviewed, so list one). Copilot is out of quota on this account and
# the self-adversarial review in the gates skill does the reviewing; the
# bot is the mechanical gate over an already-reviewed diff. Summon it
# with a PR comment: "@codex review".
#
# The checker is the reusable workflow in the public tds-utils repo
# (9atatimer/tds-utils .github/workflows/review-settled.yml), pinned to a
# commit of master rather than trusting `@master` to stay green; bump
# `uses:` and `tools_ref:` together to move it. GitHub has
# no workflow trigger for a thread being resolved, so this fires on the
# review, on replies in threads, on PR comments (the epilogue posted
# after resolving), on pushes, and by hand.

name: review-settled

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to re-evaluate
        type: number
        required: true

concurrency:
  group: review-settled-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review-settled:
    # issue_comment also fires for plain issues; only PR comments matter.
    # A fork PR is skipped on the events that carry a pull_request payload:
    # its token is read-only, so the status could never be posted and
    # tedium would wait on it forever. On issue_comment the payload has no
    # head repo; the checker itself refuses a fork PR from the API's
    # isCrossRepository. Fork PRs are human-merge.
    if: >-
      (github.event_name != 'issue_comment' || github.event.issue.pull_request != null)
      && (github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository)
    uses: 9atatimer/tds-utils/.github/workflows/review-settled.yml@020aaf53d8c87830ad26491a089ff692cf846bd0
    permissions:
      statuses: write
      pull-requests: read
      contents: read
    with:
      reviewers: chatgpt-codex-connector
      tools_ref: 020aaf53d8c87830ad26491a089ff692cf846bd0
      pr: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
