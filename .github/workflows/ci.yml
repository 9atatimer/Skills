# ci.yml -- the non-discretionary gate: tests, the publicity guard
# (scripts/publicity-guard.mjs --all) over the full tree, so nothing the
# guard's denylists cover can merge even if a local commit bypassed the
# husky hooks, and the adherence judgement (the `adherence` job below).
#
# `gate` is the one always-present check the main ruleset requires and
# tedium waits for (issue #33): it needs every other job and fails on any
# failure or cancellation. Add every new job to its `needs`. The tedium/*
# branches are where tedium builds its staging commits; without them in
# the trigger a batch waits timeout_sec for a check that never runs.
#
# ci.magic (the natural-language assertion rung) is wired separately once
# the naatm-ci-magic invocation is ported from template-tools.

name: ci

on:
  push:
    branches: [main, tedium/merge, tedium/try]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: tests
        run: npm test
      - name: publicity guard (full tree)
        run: npm run guard

  # The adherence suite judges the change in its ci stage (tds-utils
  # docs/design/DESIGN.ARCH-ADHERENCE.md; Issue#601). `uses:` and `tools_ref`
  # pin the same tds-utils commit and move together. Lowered and not run
  # fail the job, inconclusive passes it. The job is in gate's needs since
  # its first green run here (run 42308481808, 2026-11-06; the
  # architecture's Rollout row); gate counts a skipped job as a failure, so
  # the job carries no `if:`. On tedium's
  # staging branches, which the bot force-pushes so the replaced tip is not
  # fetched, the base is the staging commit's first parent.
  adherence:
    uses: 9atatimer/tds-utils/.github/workflows/adherence.yml@50214ac27a7ceb40a4a1ad3e54d583edd1c4089b
    permissions:
      contents: read
      pull-requests: read
    with:
      tools_ref: 50214ac27a7ceb40a4a1ad3e54d583edd1c4089b
      base: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/tedium/')) && format('{0}^1', github.sha) || '' }}
      timeout_minutes: 15
    # The one credential: the adherence vault's read-only 1Password service
    # account, through which the workflow finds the hosted judge's token by
    # tag (tds-utils adherence.yml, Credentials). Without it the judged
    # checks are coverage.
    secrets:
      ADHERENCE_OP_SA_TOKEN: ${{ secrets.ADHERENCE_OP_SA_TOKEN }}

  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    needs: [ci, adherence]
    permissions: {}
    steps:
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled|skipped)"'; then
            echo "::error::a needed job failed, was cancelled, or was skipped"
            exit 1
          fi
